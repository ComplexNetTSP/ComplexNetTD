[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-network-labs"
version = "0.1.0"
description = "Jupyter lab exercises for complex networks and graph machine learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "tqdm",
    "numpy",
    "scipy>=1.8.1",
    "networkx>=3.0",
    "setuptools>=59.5.0",
    "torch>=1.13.0",
    "torchvision",
    "torchaudio",
    "tensorboard",
    "torchmetrics",
    "scikit-learn>=1.0",
    "neo4j-driver",
    "scikit-network",
    "ogb",
    "ninja",
    "wheel",
    "torch-geometric",
    "nbgrader",
]

[tool.setuptools]
py-modules = []
