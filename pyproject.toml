[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-network-labs"
version = "0.1.0"
description = "Jupyter lab exercises for complex networks and graph machine learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.5",
    "pandas>=1.5",
    "networkx>=3.0",
    "packaging>=23.0",
    "tqdm>=4.65",
    "tensorboard>=2.14",
    "jupyter",
    "jupyterlab",
    "ipykernel",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy>=1.8.1",
    "setuptools>=59.5.0",
    "scikit-learn>=1.0",
    "neo4j-driver",
    "scikit-network",
    "ogb",
    "ninja",
    "wheel",
    "nbgrader",
    "datasets",
    "duckdb",
    "spacy",
    "gliner",
    "ipywidgets",
    "sentence-transformers",
]

[tool.setuptools]
py-modules = []
